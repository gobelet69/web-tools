<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Parser - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>URL Parser</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>URL Input</legend>
      <input type="text" id="url-in" value="https://user:pass@example.com:8080/path/to/page?query=string&foo=bar#hash" style="width:100%;">
    </fieldset>
    <fieldset>
      <legend>Parsed Components</legend>
      <table style="width:100%; border-collapse:collapse; text-align:left;">
        <tbody id="out"></tbody>
      </table>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('url-parser');
    document.getElementById('url-in').addEventListener('input', (e) => {
      const out = document.getElementById('out');
      out.innerHTML = '';
      try {
        const url = new URL(e.target.value);
        const props = ['href','origin','protocol','username','password','host','hostname','port','pathname','search','hash'];
        props.forEach(p => {
          out.innerHTML += `<tr><td style="border:1px solid #ccc; padding:4px;"><strong>${p}</strong></td><td style="border:1px solid #ccc; padding:4px;">${Common.escapeHtml(url[p])}</td></tr>`;
        });
        if(url.searchParams) {
          out.innerHTML += `<tr><td colspan="2" style="background:#eee; text-align:center;"><strong>Search Params</strong></td></tr>`;
          url.searchParams.forEach((v, k) => {
            out.innerHTML += `<tr><td style="border:1px solid #ccc; padding:4px;"><strong>${Common.escapeHtml(k)}</strong></td><td style="border:1px solid #ccc; padding:4px;">${Common.escapeHtml(v)}</td></tr>`;
          });
        }
      } catch(err) {
        out.innerHTML = '<tr><td style="color:red;">Invalid URL</td></tr>';
      }
    });
    document.getElementById('url-in').dispatchEvent(new Event('input'));
  </script>
</body>
</html>
