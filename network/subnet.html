<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subnet Calculator - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Subnet Calculator</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>IP Address & Mask</legend>
      <input type="text" id="ip" value="192.168.1.10" placeholder="IP Address">
      / 
      <input type="number" id="cidr" value="24" min="0" max="32" style="width:60px;">
    </fieldset>
    <fieldset>
      <legend>Results</legend>
      <table style="width:100%; border-collapse:collapse; text-align:left;">
        <tbody id="out"></tbody>
      </table>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('subnet-calculator');
    function ipToInt(ip) { return ip.split('.').reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0; }
    function intToIp(int) { return [ (int >>> 24) & 255, (int >>> 16) & 255, (int >>> 8) & 255, int & 255 ].join('.'); }
    
    const update = () => {
      const ipStr = document.getElementById('ip').value;
      const cidr = parseInt(document.getElementById('cidr').value);
      const out = document.getElementById('out');
      
      if(!ipStr.match(/^(\d{1,3}\.){3}\d{1,3}$/) || isNaN(cidr) || cidr < 0 || cidr > 32) { out.innerHTML = '<tr><td style="color:red;">Invalid IP or CIDR</td></tr>'; return; }
      
      const ip = ipToInt(ipStr);
      const mask = cidr === 0 ? 0 : (~0 << (32 - cidr)) >>> 0;
      const network = (ip & mask) >>> 0;
      const broadcast = (network | ~mask) >>> 0;
      const minHost = cidr < 31 ? (network + 1) >>> 0 : network;
      const maxHost = cidr < 31 ? (broadcast - 1) >>> 0 : broadcast;
      const hosts = cidr === 32 ? 1 : cidr === 31 ? 2 : (broadcast - network - 1);
      
      const addRow = (label, val) => `<tr><td style="border:1px solid #ccc; padding:0.5rem; font-weight:bold;">${label}</td><td style="border:1px solid #ccc; padding:0.5rem; font-family:monospace;">${val}</td></tr>`;
      out.innerHTML = addRow('Network Address', intToIp(network)) +
                      addRow('Netmask', intToIp(mask)) +
                      addRow('Broadcast Address', intToIp(broadcast)) +
                      addRow('Host Range', `${intToIp(minHost)} - ${intToIp(maxHost)}`) +
                      addRow('Total Hosts', hosts.toLocaleString());
    };
    document.getElementById('ip').addEventListener('input', update);
    document.getElementById('cidr').addEventListener('input', update);
    update();
  </script>
</body>
</html>
