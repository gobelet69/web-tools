<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort Lines - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header>
    <nav><a href="../index.html">← Back to Tools</a></nav>
    <h1>Sort Lines</h1>
    <button id="fav-btn">☆ Add to Favorites</button>
    <p>Sort lines alphabetically.</p>
  </header>
  <main>
    <fieldset><legend>Input Text</legend><textarea id="input-text" rows="8" style="width: 100%; box-sizing: border-box;"></textarea></fieldset>
    <button id="asc-btn">Sort A-Z</button> <button id="desc-btn">Sort Z-A</button>
    <fieldset><legend>Output Text</legend><textarea id="output-text" rows="8" style="width: 100%; box-sizing: border-box;" readonly></textarea></fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('sort-lines');
    const input = document.getElementById('input-text');
    const output = document.getElementById('output-text');
    document.getElementById('asc-btn').onclick = () => output.value = input.value.split('\n').sort().join('\n');
    document.getElementById('desc-btn').onclick = () => output.value = input.value.split('\n').sort().reverse().join('\n');
  </script>
</body>
</html>
