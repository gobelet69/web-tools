<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO 8601 Converter - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>ISO 8601 Converter</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Date/Time Input</legend>
      <input type="datetime-local" id="dt" step="1">
    </fieldset>
    <fieldset>
      <legend>ISO 8601 Output</legend>
      <input type="text" id="res" style="width:100%; font-family:monospace; font-size:1.2rem;" readonly>
      <button id="copy-btn">Copy</button>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('iso-converter');
    document.getElementById('dt').addEventListener('input', (e) => {
      const d = new Date(e.target.value);
      if(!isNaN(d)) document.getElementById('res').value = d.toISOString();
    });
    document.getElementById('copy-btn').onclick = () => navigator.clipboard.writeText(document.getElementById('res').value);
  </script>
</body>
</html>
