<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Generator - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Gradient Generator</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Options</legend>
      <label>Color 1: <input type="color" id="c1" value="#4facfe"></label>
      <label>Color 2: <input type="color" id="c2" value="#00f2fe"></label>
      <label>Angle (deg): <input type="number" id="ang" value="90" style="width: 60px;"></label>
    </fieldset>
    <fieldset>
      <legend>Preview</legend>
      <div id="preview" style="width:100%; height:150px; border:1px solid #ccc; border-radius:4px;"></div>
    </fieldset>
    <fieldset>
      <legend>CSS Code</legend>
      <textarea id="output" rows="3" style="width: 100%; box-sizing: border-box;" readonly></textarea>
      <br><button id="copy-btn">Copy CSS</button>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('gradient-generator');
    const update = () => {
      const css = `background: linear-gradient(${document.getElementById('ang').value}deg, ${document.getElementById('c1').value}, ${document.getElementById('c2').value});`;
      document.getElementById('preview').style = `width:100%; height:150px; border:1px solid #ccc; border-radius:4px; ${css}`;
      document.getElementById('output').value = css;
    };
    document.getElementById('c1').addEventListener('input', update);
    document.getElementById('c2').addEventListener('input', update);
    document.getElementById('ang').addEventListener('input', update);
    update();
    document.getElementById('copy-btn').onclick = () => navigator.clipboard.writeText(document.getElementById('output').value);
  </script>
</body>
</html>
