<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random String Generator - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Random String Generator</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Configuration</legend>
      <label>Length: <input type="number" id="len" value="32" min="1"></label><br>
      <label>Characters to use: <input type="text" id="chars" value="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*" style="width:100%;"></label>
      <button id="gen-btn">Generate</button>
    </fieldset>
    <fieldset>
      <legend>Output</legend>
      <textarea id="output" rows="4" style="width:100%; box-sizing:border-box; font-family:monospace;" readonly></textarea>
      <br><button id="copy-btn">Copy</button>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('random-string');
    document.getElementById('gen-btn').onclick = () => {
      const chars = document.getElementById('chars').value;
      const len = parseInt(document.getElementById('len').value) || 32;
      if(!chars) { document.getElementById('output').value = 'Define character set.'; return; }
      const array = new Uint32Array(len);
      crypto.getRandomValues(array);
      let res = '';
      for(let i=0; i<len; i++) res += chars[array[i] % chars.length];
      document.getElementById('output').value = res;
    };
    document.getElementById('gen-btn').click();
    document.getElementById('copy-btn').onclick = () => navigator.clipboard.writeText(document.getElementById('output').value);
  </script>
</body>
</html>
