<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header>
    <nav><a href="../index.html">← Back to Tools</a></nav>
    <h1>Password Generator</h1>
    <button id="fav-btn">☆ Add to Favorites</button>
    <p>Generate secure random passwords locally.</p>
    <p><em>Uses Web Crypto API. Math.random() is never used.</em></p>
  </header>

  <main>
    <fieldset>
      <legend>Settings</legend>
      <label>
        Length: <span id="len-val">16</span>
        <input type="range" id="length-slider" min="8" max="128" value="16">
      </label>
      <br><br>
      <label><input type="checkbox" id="chk-upper" checked> Uppercase (A-Z)</label><br>
      <label><input type="checkbox" id="chk-lower" checked> Lowercase (a-z)</label><br>
      <label><input type="checkbox" id="chk-num" checked> Numbers (0-9)</label><br>
      <label><input type="checkbox" id="chk-sym" checked> Symbols (!@#$%^&*)</label><br>
      <br>
      <button id="generate-btn">Generate</button>
    </fieldset>

    <fieldset>
      <legend>Output</legend>
      <input type="text" id="output" style="width: 100%; box-sizing: border-box; font-family: monospace; font-size: 1.2rem; padding: 0.5rem;" readonly>
      <br><br>
      <button id="copy-btn">Copy Password</button>
    </fieldset>
  </main>

  <script>
    'use strict';
    Common.initTool('password-generator');

    const lengthSlider = document.getElementById('length-slider');
    const lenVal = document.getElementById('len-val');
    const chkUpper = document.getElementById('chk-upper');
    const chkLower = document.getElementById('chk-lower');
    const chkNum = document.getElementById('chk-num');
    const chkSym = document.getElementById('chk-sym');
    const generateBtn = document.getElementById('generate-btn');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copy-btn');

    lengthSlider.addEventListener('input', () => {
      lenVal.textContent = lengthSlider.value;
    });

    const CHARS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      num: '0123456789',
      sym: '!@#$%^&*()_+~`|}{[]:;?><,./-='
    };

    function generate() {
      let charset = '';
      if (chkUpper.checked) charset += CHARS.upper;
      if (chkLower.checked) charset += CHARS.lower;
      if (chkNum.checked) charset += CHARS.num;
      if (chkSym.checked) charset += CHARS.sym;
      
      if (!charset) {
        output.value = 'Please select at least one character set.';
        return;
      }
      
      const length = parseInt(lengthSlider.value, 10);
      const array = new Uint32Array(length);
      crypto.getRandomValues(array);
      
      let password = '';
      for (let i = 0; i < length; i++) {
        password += charset[array[i] % charset.length];
      }
      
      output.value = password;
    }

    generateBtn.addEventListener('click', generate);
    
    // Generate one on load
    generate();

    copyBtn.addEventListener('click', async () => {
      if (output.value && output.value.length >= 8) {
        await navigator.clipboard.writeText(output.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = originalText, 1500);
      }
    });
  </script>
</body>
</html>
