<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Info - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Video Info</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset id="drop-zone"><legend>Select Video</legend><input type="file" id="file-input" accept="video/*"></fieldset>
    <fieldset id="info" hidden>
      <legend>Information</legend>
      <p>Duration: <strong id="dur"></strong> seconds</p>
      <p>Resolution: <strong id="res"></strong></p>
      <p>Size: <strong id="size"></strong></p>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('video-info');
    Common.setupDropZone('drop-zone', 'file-input', (file) => {
      if(!file || !file.type.startsWith('video/')) return;
      document.getElementById('size').textContent = Common.formatBytes(file.size);
      const vid = document.createElement('video');
      vid.onloadedmetadata = () => {
        document.getElementById('info').hidden = false;
        document.getElementById('dur').textContent = vid.duration.toFixed(2);
        document.getElementById('res').textContent = `${vid.videoWidth} × ${vid.videoHeight}`;
      };
      vid.src = URL.createObjectURL(file);
    });
  </script>
</body>
</html>
