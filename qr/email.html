<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email to QR - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
  <script src="../vendor/qrious.min.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Email to QR</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Email Configuration</legend>
      <label>To:<br><input type="email" id="em" style="width:100%; box-sizing:border-box;"></label><br><br>
      <label>Subject:<br><input type="text" id="sub" style="width:100%; box-sizing:border-box;"></label><br><br>
      <label>Body:<br><textarea id="bod" rows="4" style="width:100%; box-sizing:border-box;"></textarea></label>
    </fieldset>
    <fieldset style="text-align:center;">
      <legend>QR Code</legend>
      <canvas id="qr"></canvas>
      <br><button id="dl-btn">Download PNG</button>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('qr-email');
    const qr = new QRious({ element: document.getElementById('qr'), size: 250, value: '' });
    const update = () => {
      const e = document.getElementById('em').value;
      const s = encodeURIComponent(document.getElementById('sub').value);
      const b = encodeURIComponent(document.getElementById('bod').value);
      if(!e) { qr.value = ''; return; }
      qr.value = `mailto:${e}?subject=${s}&body=${b}`;
    };
    ['em','sub','bod'].forEach(id => document.getElementById(id).addEventListener('input', update));
    document.getElementById('dl-btn').onclick = () => {
      if(!document.getElementById('em').value) return;
      const link = document.createElement('a');
      link.download = 'qr-email.png'; link.href = document.getElementById('qr').toDataURL(); link.click();
    };
  </script>
</body>
</html>
