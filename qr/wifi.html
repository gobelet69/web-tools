<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi to QR - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
  <script src="../vendor/qrious.min.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>WiFi to QR</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>WiFi Configuration</legend>
      <label>Network Name (SSID):<br><input type="text" id="ssid" style="width:100%; box-sizing:border-box;"></label><br><br>
      <label>Password:<br><input type="text" id="pwd" style="width:100%; box-sizing:border-box;"></label><br><br>
      <label>Encryption:
        <select id="enc">
          <option value="WPA">WPA/WPA2/WPA3</option>
          <option value="WEP">WEP</option>
          <option value="nopass">None</option>
        </select>
      </label>
      <label style="margin-left:1rem;"><input type="checkbox" id="hidden"> Hidden Network</label>
    </fieldset>
    <fieldset style="text-align:center;">
      <legend>QR Code</legend>
      <canvas id="qr"></canvas>
      <br><button id="dl-btn">Download PNG</button>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('qr-wifi');
    const qr = new QRious({ element: document.getElementById('qr'), size: 250, value: '' });
    const update = () => {
      const s = document.getElementById('ssid').value.replace(/([\\;:])/g, '\\$1');
      const p = document.getElementById('pwd').value.replace(/([\\;:])/g, '\\$1');
      const e = document.getElementById('enc').value;
      const h = document.getElementById('hidden').checked ? 'true' : 'false';
      if(!s) { qr.value = ''; return; }
      qr.value = `WIFI:T:${e};S:${s};P:${p};H:${h};;`;
    };
    ['ssid','pwd','enc','hidden'].forEach(id => document.getElementById(id).addEventListener('input', update));
    document.getElementById('dl-btn').onclick = () => {
      if(!document.getElementById('ssid').value) return;
      const link = document.createElement('a');
      link.download = 'qr-wifi.png'; link.href = document.getElementById('qr').toDataURL(); link.click();
    };
  </script>
</body>
</html>
