<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to QR - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
  <script src="../vendor/qrious.min.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Text to QR</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Input Text</legend>
      <textarea id="val" rows="4" style="width:100%; box-sizing:border-box;"></textarea>
    </fieldset>
    <fieldset style="text-align:center;">
      <legend>QR Code</legend>
      <canvas id="qr"></canvas>
      <br><button id="dl-btn">Download PNG</button>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('qr-text');
    const qr = new QRious({ element: document.getElementById('qr'), size: 250, value: '' });
    document.getElementById('val').addEventListener('input', (e) => { qr.value = e.target.value; });
    document.getElementById('dl-btn').onclick = () => {
      if(!document.getElementById('val').value) return;
      const link = document.createElement('a');
      link.download = 'qr-code.png'; link.href = document.getElementById('qr').toDataURL(); link.click();
    };
  </script>
</body>
</html>
