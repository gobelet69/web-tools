<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss Army Knife of the Web</title>
  <script src="js/tools.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <header>
    <h1>Swiss Army Knife of the Web</h1>
    <p>A collection of extremely fast, privacy-respecting, client-side tools.</p>
    <nav>
      <a href="about.html">About</a> | 
      <a href="privacy.html">Privacy</a>
    </nav>
  </header>

  <main>
    <section>
      <fieldset>
        <legend>Search</legend>
        <input type="search" id="search-input" placeholder="Search tools (e.g. pdf, image, hash)" style="width: 100%;">
      </fieldset>
    </section>

    <section id="results-section" hidden>
      <h2>Search Results</h2>
      <ul id="results-list"></ul>
    </section>

    <section id="recent-section" hidden>
      <h2>Recently Used</h2>
      <ul id="recent-list"></ul>
    </section>

    <section id="fav-section" hidden>
      <h2>Favorites</h2>
      <ul id="fav-list"></ul>
    </section>

    <section id="categories-section">
      <!-- Generated by JS -->
    </section>
  </main>

  <script>
    'use strict';

    function renderToolLink(tool) {
      return `<li>
        <a href="${tool.url}">${tool.name}</a>
        - <small>${tool.desc}</small>
        ${!tool.ready ? ' <em>(Planned)</em>' : ''}
      </li>`;
    }

    function init() {
      const tools = Common.getTools();
      const categoriesSection = document.getElementById('categories-section');
      const recentSection = document.getElementById('recent-section');
      const recentList = document.getElementById('recent-list');
      const favSection = document.getElementById('fav-section');
      const favList = document.getElementById('fav-list');
      const searchInput = document.getElementById('search-input');
      const resultsSection = document.getElementById('results-section');
      const resultsList = document.getElementById('results-list');

      // Group by category
      const byCat = {};
      tools.forEach(t => {
        if (!byCat[t.cat]) byCat[t.cat] = [];
        byCat[t.cat].push(t);
      });

      // Render Categories
      Object.keys(byCat).forEach(cat => {
        const h2 = document.createElement('h2');
        h2.textContent = cat;
        const ul = document.createElement('ul');
        ul.innerHTML = byCat[cat].map(renderToolLink).join('');
        categoriesSection.appendChild(h2);
        categoriesSection.appendChild(ul);
      });

      // Render Recents
      const recents = Common.getRecent();
      if (recents.length > 0) {
        recentSection.hidden = false;
        recentList.innerHTML = recents.map(id => {
          const t = Common.getTool(id);
          return t ? renderToolLink(t) : '';
        }).join('');
      }

      // Render Favs
      const favs = Common.getFavs();
      if (favs.length > 0) {
        favSection.hidden = false;
        favList.innerHTML = favs.map(id => {
          const t = Common.getTool(id);
          return t ? renderToolLink(t) : '';
        }).join('');
      }

      // Search Logic
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
          resultsSection.hidden = true;
          categoriesSection.hidden = false;
          if (recents.length > 0) recentSection.hidden = false;
          if (favs.length > 0) favSection.hidden = false;
          return;
        }

        resultsSection.hidden = false;
        categoriesSection.hidden = true;
        recentSection.hidden = true;
        favSection.hidden = true;

        const matches = tools.filter(t => {
          return t.name.toLowerCase().includes(query) || 
                 t.desc.toLowerCase().includes(query) || 
                 t.keys.some(k => k.toLowerCase().includes(query));
        });

        if (matches.length === 0) {
          resultsList.innerHTML = '<li>No tools found.</li>';
        } else {
          resultsList.innerHTML = matches.map(renderToolLink).join('');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
