<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reorder Pages - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
  <!-- Load pdf-lib from local vendor folder -->
  <script src="../vendor/pdf-lib.min.js"></script>
</head>
<body>
  <header>
    <nav><a href="../index.html">← Back to Tools</a></nav>
    <h1>PDF Reorder Pages</h1>
    <button id="fav-btn">☆ Add to Favorites</button>
    <p>Reorder or duplicate pages in a PDF document.</p>
    <p><em>Processed locally in your browser. Your files are not uploaded.</em></p>
  </header>

  <main>
    <fieldset id="drop-zone">
      <legend>Select PDF</legend>
      <input type="file" id="file-input" accept="application/pdf">
      <p>Or drag & drop it here</p>
    </fieldset>

    <fieldset id="controls" disabled>
      <legend>New Page Order</legend>
      <p>File: <strong id="file-info"></strong></p>
      <p>Total Pages: <strong id="total-pages"></strong></p>
      
      <label>
        Specify the exact sequence of pages (comma separated, supports ranges):<br>
        <input type="text" id="page-input" placeholder="e.g. 5, 4, 3, 2, 1" style="width: 100%; box-sizing: border-box; padding: 0.5rem;">
      </label>
      <p><small>Note: You can omit pages to delete them, or repeat pages to duplicate them.</small></p>
      <br>
      <button id="process-btn" style="padding: 0.5rem 1rem; font-weight: bold;">Reorder & Download</button>
      <span id="status-msg" style="margin-left: 1rem;"></span>
    </fieldset>
  </main>

  <script>
    'use strict';
    Common.initTool('pdf-reorder');

    const fileInput = document.getElementById('file-input');
    const processBtn = document.getElementById('process-btn');
    const controls = document.getElementById('controls');
    const statusMsg = document.getElementById('status-msg');
    
    let currentPdfDoc = null;
    let currentFile = null;

    Common.setupDropZone('drop-zone', 'file-input', async (file) => {
      if (!file || file.type !== 'application/pdf') return;
      currentFile = file;
      
      try {
        const arrayBuffer = await file.arrayBuffer();
        currentPdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
        
        document.getElementById('file-info').textContent = `${file.name} (${Common.formatBytes(file.size)})`;
        const total = currentPdfDoc.getPageCount();
        document.getElementById('total-pages').textContent = total;
        
        // Auto-fill input with reverse order as an example if small, or just 1..N
        const arr = Array.from({length: total}, (_, i) => i + 1);
        document.getElementById('page-input').value = arr.join(', ');
        
        controls.disabled = false;
      } catch (err) {
        console.error(err);
        alert('Could not parse PDF file.');
      }
    });

    // Parse string "1, 3, 5-10" into array of 0-indexed page numbers, preserving exact order
    function parsePageSequence(inputStr, maxPages) {
      const pages = [];
      const parts = inputStr.split(',');
      
      for (let p of parts) {
        p = p.trim();
        if (!p) continue;
        
        if (p.includes('-')) {
          const range = p.split('-');
          let start = parseInt(range[0], 10);
          let end = parseInt(range[1], 10);
          if (!isNaN(start) && !isNaN(end)) {
            // Support both ascending (5-10) and descending (10-5) ranges
            start = Math.max(1, Math.min(maxPages, start));
            end = Math.max(1, Math.min(maxPages, end));
            if (start <= end) {
              for (let i = start; i <= end; i++) pages.push(i - 1);
            } else {
              for (let i = start; i >= end; i--) pages.push(i - 1);
            }
          }
        } else {
          const num = parseInt(p, 10);
          if (!isNaN(num) && num >= 1 && num <= maxPages) {
            pages.push(num - 1);
          }
        }
      }
      return pages;
    }

    processBtn.addEventListener('click', async () => {
      if (!currentPdfDoc) return;
      
      const inputStr = document.getElementById('page-input').value;
      const maxPages = currentPdfDoc.getPageCount();
      const pageIndices = parsePageSequence(inputStr, maxPages);
      
      if (pageIndices.length === 0) {
        alert('Please enter a valid page sequence.');
        return;
      }
      
      try {
        statusMsg.textContent = 'Processing...';
        processBtn.disabled = true;
        
        const newPdf = await PDFLib.PDFDocument.create();
        
        // pdf-lib copyPages requires a unique array of indices to copy from the source document.
        // We copy all needed pages once, then add them in the requested order.
        const uniqueIndices = [...new Set(pageIndices)];
        const copiedPages = await newPdf.copyPages(currentPdfDoc, uniqueIndices);
        
        // Map original index to the copied Page object
        const pageMap = {};
        uniqueIndices.forEach((idx, i) => {
          pageMap[idx] = copiedPages[i];
        });
        
        // Add pages to the new document in the requested order
        pageIndices.forEach(idx => {
          newPdf.addPage(pageMap[idx]);
        });
        
        const pdfBytes = await newPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        
        const outName = currentFile.name.replace('.pdf', '') + '-reordered.pdf';
        Common.downloadBlob(blob, outName);
        
        statusMsg.textContent = 'Done!';
      } catch (err) {
        console.error(err);
        statusMsg.textContent = 'Error reordering pages.';
        statusMsg.style.color = 'red';
      } finally {
        processBtn.disabled = false;
        setTimeout(() => { if(statusMsg.textContent === 'Done!') statusMsg.textContent = ''; }, 3000);
      }
    });
  </script>
</body>
</html>
