<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Info - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Audio Info</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset id="drop-zone"><legend>Select Audio</legend><input type="file" id="file-input" accept="audio/*"></fieldset>
    <fieldset id="info" hidden>
      <legend>Information</legend>
      <p>Duration: <strong id="dur"></strong> seconds</p>
      <p>Sample Rate: <strong id="sr"></strong> Hz</p>
      <p>Channels: <strong id="ch"></strong></p>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('audio-info');
    Common.setupDropZone('drop-zone', 'file-input', (file) => {
      if(!file || !file.type.startsWith('audio/')) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const reader = new FileReader();
      reader.onload = (e) => {
        ctx.decodeAudioData(e.target.result, (buffer) => {
          document.getElementById('info').hidden = false;
          document.getElementById('dur').textContent = buffer.duration.toFixed(2);
          document.getElementById('sr').textContent = buffer.sampleRate;
          document.getElementById('ch').textContent = buffer.numberOfChannels;
        });
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
