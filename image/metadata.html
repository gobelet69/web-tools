<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Metadata Viewer - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
  <script src="../vendor/exif.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Image Metadata Viewer</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset id="drop-zone"><legend>Select Image</legend><input type="file" id="file-input" accept="image/jpeg, image/tiff"></fieldset>
    <fieldset id="info" hidden>
      <legend>EXIF Metadata</legend>
      <p id="no-exif" hidden style="color:gray; font-style:italic;">No EXIF metadata found in this image.</p>
      <table style="width:100%; border-collapse:collapse; text-align:left;">
        <tbody id="out"></tbody>
      </table>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('metadata-viewer');
    Common.setupDropZone('drop-zone', 'file-input', (file) => {
      if(!file || !file.type.startsWith('image/')) return;
      document.getElementById('info').hidden = false;
      const out = document.getElementById('out');
      out.innerHTML = '';
      document.getElementById('no-exif').hidden = true;
      
      EXIF.getData(file, function() {
        const tags = EXIF.getAllTags(this);
        const keys = Object.keys(tags).filter(k => k !== 'thumbnail');
        if(keys.length === 0) { document.getElementById('no-exif').hidden = false; return; }
        keys.forEach(k => {
          let val = tags[k];
          if(val && val.length > 50) val = val.toString().substring(0, 50) + '...';
          out.innerHTML += `<tr><td style="border:1px solid #ccc; padding:4px;"><strong>${Common.escapeHtml(k)}</strong></td><td style="border:1px solid #ccc; padding:4px;">${Common.escapeHtml(val)}</td></tr>`;
        });
      });
    });
  </script>
</body>
</html>
