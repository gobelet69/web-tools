<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Convert - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header>
    <nav><a href="../index.html">← Back to Tools</a></nav>
    <h1>Image Convert</h1>
    <button id="fav-btn">☆ Add to Favorites</button>
    <p>Convert images between PNG, JPG, and WebP.</p>
    <p><em>Processed locally in your browser. Your files are not uploaded.</em></p>
  </header>

  <main>
    <fieldset id="drop-zone" style="border: 2px dashed #ccc; padding: 1rem; margin-bottom: 1rem;">
      <legend>Select Image</legend>
      <input type="file" id="file-input" accept="image/*">
      <p>Or drag & drop an image here</p>
    </fieldset>

    <fieldset id="controls" disabled>
      <legend>Output Format</legend>
      <label>
        Format:
        <select id="format-select">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <div id="quality-wrapper" hidden>
        <label>
          Quality: <span id="q-val">0.9</span>
          <input type="range" id="quality-input" min="0.1" max="1.0" step="0.1" value="0.9">
        </label>
      </div>
      <br><br>
      <button id="process-btn">Convert & Download</button>
    </fieldset>
    
  </main>

  <script>
    'use strict';
    Common.initTool('image-convert');

    const formatSelect = document.getElementById('format-select');
    const qualityInput = document.getElementById('quality-input');
    const qualityWrapper = document.getElementById('quality-wrapper');
    const qVal = document.getElementById('q-val');
    const processBtn = document.getElementById('process-btn');
    const controls = document.getElementById('controls');
    
    let currentImage = null;
    let origFile = null;

    Common.setupDropZone('drop-zone', 'file-input', (file) => {
      if (!file || !file.type.startsWith('image/')) return;
      origFile = file;
      
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        controls.disabled = false;
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });

    formatSelect.addEventListener('change', () => {
      if (formatSelect.value === 'image/jpeg' || formatSelect.value === 'image/webp') {
        qualityWrapper.hidden = false;
      } else {
        qualityWrapper.hidden = true;
      }
    });

    qualityInput.addEventListener('input', () => {
      qVal.textContent = qualityInput.value;
    });

    processBtn.addEventListener('click', () => {
      if (!currentImage) return;
      
      const canvas = document.createElement('canvas');
      canvas.width = currentImage.width;
      canvas.height = currentImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(currentImage, 0, 0);
      
      const format = formatSelect.value;
      const ext = format.split('/')[1];
      const quality = parseFloat(qualityInput.value);
      
      canvas.toBlob((blob) => {
        const outName = origFile.name.replace(/\.[^/.]+$/, "") + "." + (ext === 'jpeg' ? 'jpg' : ext);
        Common.downloadBlob(blob, outName);
      }, format, quality);
    });
  </script>
</body>
</html>
