<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encode/Decode - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header>
    <nav><a href="../index.html">← Back to Tools</a></nav>
    <h1>URL Encode/Decode</h1>
    <button id="fav-btn">☆ Add to Favorites</button>
    <p>Encode or decode URL components.</p>
    <p><em>Processed locally in your browser.</em></p>
  </header>

  <main>
    <fieldset>
      <legend>Input</legend>
      <textarea id="input-text" rows="8" style="width: 100%; box-sizing: border-box;"></textarea>
    </fieldset>

    <div style="margin: 1rem 0;">
      <button id="encode-btn">Encode URI Component</button>
      <button id="decode-btn">Decode URI Component</button>
    </div>

    <fieldset>
      <legend>Output</legend>
      <textarea id="output-text" rows="8" style="width: 100%; box-sizing: border-box;" readonly></textarea>
      <br>
      <button id="copy-btn">Copy Output</button>
    </fieldset>
  </main>

  <script>
    'use strict';
    Common.initTool('url-encode');

    const input = document.getElementById('input-text');
    const output = document.getElementById('output-text');
    const encodeBtn = document.getElementById('encode-btn');
    const decodeBtn = document.getElementById('decode-btn');
    const copyBtn = document.getElementById('copy-btn');

    encodeBtn.addEventListener('click', () => {
      try {
        output.value = encodeURIComponent(input.value);
      } catch (e) {
        output.value = 'Error: ' + e.message;
      }
    });

    decodeBtn.addEventListener('click', () => {
      try {
        output.value = decodeURIComponent(input.value);
      } catch (e) {
        output.value = 'Error: Invalid URL encoding.';
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (output.value) {
        await navigator.clipboard.writeText(output.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = originalText, 1500);
      }
    });
  </script>
</body>
</html>
