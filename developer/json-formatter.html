<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header>
    <nav><a href="../index.html">← Back to Tools</a></nav>
    <h1>JSON Formatter</h1>
    <button id="fav-btn">☆ Add to Favorites</button>
    <p>Format and beautify JSON data.</p>
    <p><em>Processed locally in your browser.</em></p>
  </header>

  <main>
    <fieldset>
      <legend>Input JSON</legend>
      <textarea id="input-text" rows="10" style="width: 100%; box-sizing: border-box; font-family: monospace;"></textarea>
    </fieldset>

    <div style="margin: 1rem 0;">
      <button id="format-btn">Format (2 Spaces)</button>
      <button id="minify-btn">Minify</button>
    </div>

    <fieldset>
      <legend>Output</legend>
      <textarea id="output-text" rows="15" style="width: 100%; box-sizing: border-box; font-family: monospace;" readonly></textarea>
      <br>
      <button id="copy-btn">Copy Output</button>
    </fieldset>
  </main>

  <script>
    'use strict';
    Common.initTool('json-formatter');

    const input = document.getElementById('input-text');
    const output = document.getElementById('output-text');
    const formatBtn = document.getElementById('format-btn');
    const minifyBtn = document.getElementById('minify-btn');
    const copyBtn = document.getElementById('copy-btn');

    formatBtn.addEventListener('click', () => {
      try {
        const obj = JSON.parse(input.value);
        output.value = JSON.stringify(obj, null, 2);
      } catch (e) {
        output.value = 'Invalid JSON: \n' + e.message;
      }
    });

    minifyBtn.addEventListener('click', () => {
      try {
        const obj = JSON.parse(input.value);
        output.value = JSON.stringify(obj);
      } catch (e) {
        output.value = 'Invalid JSON: \n' + e.message;
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (output.value) {
        await navigator.clipboard.writeText(output.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = originalText, 1500);
      }
    });
  </script>
</body>
</html>
