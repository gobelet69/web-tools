<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Generator - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Palette Generator</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Base Color</legend>
      <input type="color" id="base" value="#3498db" style="width: 100px; height: 100px; padding: 0; border: none;">
    </fieldset>
    <fieldset>
      <legend>Generated Palette</legend>
      <div id="palettes" style="display:flex; flex-direction:column; gap:1rem;"></div>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('palette-generator');
    function hexToHsl(H) {
      let r = 0, g = 0, b = 0;
      if (H.length == 7) { r = parseInt(H.substring(1, 3), 16); g = parseInt(H.substring(3, 5), 16); b = parseInt(H.substring(5, 7), 16); }
      r /= 255; g /= 255; b /= 255;
      let cmin = Math.min(r,g,b), cmax = Math.max(r,g,b), delta = cmax - cmin, h = 0, s = 0, l = 0;
      if (delta == 0) h = 0; else if (cmax == r) h = ((g - b) / delta) % 6; else if (cmax == g) h = (b - r) / delta + 2; else h = (r - g) / delta + 4;
      h = Math.round(h * 60); if (h < 0) h += 360;
      l = (cmax + cmin) / 2; s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
      s = +(s * 100).toFixed(1); l = +(l * 100).toFixed(1);
      return [h, s, l];
    }
    const render = (name, colors) => `<div><strong>${name}</strong><div style="display:flex; height:50px;">${colors.map(c => `<div style="flex:1; background:hsl(${c[0]},${c[1]}%,${c[2]}%);" title="hsl(${c[0]},${c[1]}%,${c[2]}%)"></div>`).join('')}</div></div>`;
    
    document.getElementById('base').addEventListener('input', (e) => {
      const [h,s,l] = hexToHsl(e.target.value);
      const out = document.getElementById('palettes');
      out.innerHTML = 
        render('Monochromatic', [[h,s,l-30], [h,s,l-15], [h,s,l], [h,s,l+15], [h,s,l+30]]) +
        render('Analogous', [[(h-30+360)%360,s,l], [(h-15+360)%360,s,l], [h,s,l], [(h+15)%360,s,l], [(h+30)%360,s,l]]) +
        render('Complementary', [[h,s,l], [(h+180)%360,s,l]]) +
        render('Triadic', [[h,s,l], [(h+120)%360,s,l], [(h+240)%360,s,l]]);
    });
    document.getElementById('base').dispatchEvent(new Event('input'));
  </script>
</body>
</html>
