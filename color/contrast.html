<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrast Checker - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Contrast Checker</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Colors</legend>
      <label>Text Color: <input type="color" id="fg" value="#ffffff"></label>
      <label>Background Color: <input type="color" id="bg" value="#000000"></label>
    </fieldset>
    <fieldset id="preview-box" style="padding:2rem; text-align:center;">
      <h2 style="margin:0;">The quick brown fox jumps over the lazy dog</h2>
    </fieldset>
    <fieldset>
      <legend>WCAG Contrast Ratio</legend>
      <p id="ratio" style="font-size:2rem; font-weight:bold;"></p>
      <p>AA Normal Text (4.5:1): <strong id="aa-normal"></strong></p>
      <p>AA Large Text (3.0:1): <strong id="aa-large"></strong></p>
      <p>AAA Normal Text (7.0:1): <strong id="aaa-normal"></strong></p>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('contrast-checker');
    function hexToRgb(h) {
      return [parseInt(h.substring(1,3),16), parseInt(h.substring(3,5),16), parseInt(h.substring(5,7),16)];
    }
    function luminance(r, g, b) {
      const a = [r, g, b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
    }
    function contrast(rgb1, rgb2) {
      const lum1 = luminance(...rgb1);
      const lum2 = luminance(...rgb2);
      const brightest = Math.max(lum1, lum2);
      const darkest = Math.min(lum1, lum2);
      return (brightest + 0.05) / (darkest + 0.05);
    }
    const update = () => {
      const fg = document.getElementById('fg').value;
      const bg = document.getElementById('bg').value;
      document.getElementById('preview-box').style.color = fg;
      document.getElementById('preview-box').style.background = bg;
      
      const cr = contrast(hexToRgb(fg), hexToRgb(bg));
      document.getElementById('ratio').textContent = cr.toFixed(2) + ' : 1';
      document.getElementById('aa-normal').textContent = cr >= 4.5 ? 'Pass ✅' : 'Fail ❌';
      document.getElementById('aa-large').textContent = cr >= 3.0 ? 'Pass ✅' : 'Fail ❌';
      document.getElementById('aaa-normal').textContent = cr >= 7.0 ? 'Pass ✅' : 'Fail ❌';
    };
    document.getElementById('fg').addEventListener('input', update);
    document.getElementById('bg').addEventListener('input', update);
    update();
  </script>
</body>
</html>
