<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEX to RGB Converter - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>HEX ↔ RGB Converter</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset>
      <legend>Color</legend>
      <input type="color" id="picker" value="#ff0000" style="width: 100px; height: 100px; padding: 0; border: none;">
    </fieldset>
    <fieldset>
      <legend>HEX</legend>
      <input type="text" id="hex-in" value="#ff0000">
    </fieldset>
    <fieldset>
      <legend>RGB</legend>
      <input type="text" id="rgb-in" value="rgb(255, 0, 0)">
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('hex-rgb');
    const picker = document.getElementById('picker'), hex = document.getElementById('hex-in'), rgb = document.getElementById('rgb-in');
    
    function hexToRgb(h) {
      let r = 0, g = 0, b = 0;
      if(h.length === 4) { r = parseInt(h[1]+h[1],16); g = parseInt(h[2]+h[2],16); b = parseInt(h[3]+h[3],16); }
      else if(h.length === 7) { r = parseInt(h.substring(1,3),16); g = parseInt(h.substring(3,5),16); b = parseInt(h.substring(5,7),16); }
      return `rgb(${r}, ${g}, ${b})`;
    }
    
    function rgbToHex(rStr) {
      const parts = rStr.match(/\d+/g);
      if(!parts || parts.length < 3) return '#000000';
      const toHex = (n) => { const hex = parseInt(n).toString(16); return hex.length===1 ? "0"+hex : hex; };
      return "#" + toHex(parts[0]) + toHex(parts[1]) + toHex(parts[2]);
    }
    
    picker.addEventListener('input', () => { hex.value = picker.value; rgb.value = hexToRgb(picker.value); });
    hex.addEventListener('input', () => { if(hex.value.startsWith('#')) { picker.value = hex.value; rgb.value = hexToRgb(hex.value); }});
    rgb.addEventListener('input', () => { const h = rgbToHex(rgb.value); hex.value = h; picker.value = h; });
  </script>
</body>
</html>
