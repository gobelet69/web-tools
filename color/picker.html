<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker - Swiss Army Knife</title>
  <script src="../js/tools.js"></script>
  <script src="../js/common.js"></script>
</head>
<body>
  <header><nav><a href="../index.html">← Back to Tools</a></nav><h1>Color Picker</h1><button id="fav-btn">☆ Add to Favorites</button></header>
  <main>
    <fieldset style="text-align:center;">
      <legend>Select Color</legend>
      <input type="color" id="picker" value="#3498db" style="width: 150px; height: 150px; padding: 0; border: none; cursor: pointer;">
      <br><br>
      <button id="eye-btn" hidden>Use Screen EyeDropper</button>
    </fieldset>
    <fieldset>
      <legend>Color Values</legend>
      <p>HEX: <strong id="hex-out" style="font-size:1.5rem; font-family:monospace;"></strong></p>
      <p>RGB: <strong id="rgb-out" style="font-family:monospace;"></strong></p>
    </fieldset>
  </main>
  <script>
    'use strict'; Common.initTool('color-picker');
    const picker = document.getElementById('picker'), eyeBtn = document.getElementById('eye-btn');
    const update = (hex) => {
      document.getElementById('hex-out').textContent = hex.toUpperCase();
      const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
      document.getElementById('rgb-out').textContent = `rgb(${r}, ${g}, ${b})`;
      picker.value = hex;
    };
    picker.addEventListener('input', (e) => update(e.target.value));
    update(picker.value);
    
    if(window.EyeDropper) {
      eyeBtn.hidden = false;
      const eyeDropper = new EyeDropper();
      eyeBtn.onclick = async () => {
        try { const res = await eyeDropper.open(); update(res.sRGBHex); } catch(e) {}
      };
    }
  </script>
</body>
</html>
